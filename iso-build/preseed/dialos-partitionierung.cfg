# DialOS: Partitionierungs-Vorgabe (Preseed) fuer den Debian-13-Installer
#
# ZWECK: Beim Aufsetzen eines Geraets soll niemand mehr von Hand
# partitionieren muessen - und trotzdem soll IMMER dasselbe Layout
# entstehen, unabhaengig davon, wie gross die verbaute Platte ist:
#
#     EFI-Partition (538 MB)
#     root          (100 GiB, ext4)
#     Rest          UNPARTITIONIERT
#
# Der freie Rest ist Absicht: dort legt spaeter
# dialos-setup-home-partition.sh den verschluesselten Swap (8 GiB) und
# die verschluesselte Partition dialos-nutzer-home an - je groesser die
# Platte, desto mehr Platz bekommt "nutzer", ohne dass hier etwas
# angepasst werden muesste.
#
# WARUM NICHT NACHTRAEGLICH VERKLEINERN: Ein eingehaengtes
# ext4-Dateisystem laesst sich nicht schrumpfen (Online-Resize kann nur
# wachsen). Ein Skript koennte die root-Partition auf dem laufenden
# System also gar nicht verkleinern. Deshalb entsteht das richtige Layout
# hier gleich beim Installieren, statt es spaeter zu reparieren.
#
# WAS DIESE DATEI BEWUSST NICHT VORGIBT: Sprache, Tastatur, Netzwerk,
# Zeitzone, das Konto "dialosadmin", Paketauswahl. Das bleibt alles
# interaktiv - diese Datei kuemmert sich ausschliesslich um die
# Partitionierung.
#
# VORAUSSETZUNG: INTERNETVERBINDUNG - KABEL ODER WLAN. Der Installer
# konfiguriert das Netzwerk, BEVOR er diese Datei holt (Debian-Doku:
# "the network must be configured before the preseed file can be
# fetched"). Ohne Kabel fragt er beim Netzwerk-Schritt nach WLAN-Name und
# Passwort und laedt die Datei erst danach - WLAN funktioniert also.
#
# Deshalb wird die Datei bewusst OHNE den "auto"-Parameter geladen: der
# senkt die Fragen-Prioritaet und koennte ausgerechnet die WLAN-Rueckfrage
# unterdruecken. Siehe Schritt 1b.
#
# Verwendung: siehe docs/Debian-zu-DialOS.md, Schritt 1.

### Zielplatte
# BEWUSST NICHT vorgegeben. Der Installer fragt weiterhin, welche Platte
# partitioniert werden soll. Das ist die einzige Sicherung dagegen, dass
# ein Preseed die falsche Platte trifft - etwa den Installations-Stick
# selbst oder eine angeschlossene externe Platte. Die Zeile bleibt
# deshalb auskommentiert:
#d-i partman-auto/disk string /dev/nvme0n1

### Partitionierungsverfahren
d-i partman-auto/method string regular
d-i partman/default_filesystem string ext4

# Reste einer Vorinstallation (LVM, Software-RAID) ohne Rueckfrage
# entfernen - laut Konzept gehen wir immer von einer leeren Platte aus.
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

### Das Rezept
# Die drei Zahlen je Partition sind Minimum / Prioritaet / Maximum in MB.
# Sie sind hier bewusst IDENTISCH: nur so verzichtet partman darauf, eine
# Partition zu vergroessern, um die Platte zu fuellen. Genau dadurch
# bleibt der Rest der Platte unpartitioniert.
#
# Kein Swap im Rezept: den legt dialos-setup-home-partition.sh spaeter
# selbst an - verschluesselt, mit einem bei jedem Start neu gewuerfelten
# Schluessel. Ein hier angelegter Swap waere unverschluesselt und muesste
# ohnehin gleich wieder ersetzt werden.
d-i partman-auto/expert_recipe string                           \
      dialos ::                                                 \
              538 538 538 free                                  \
                      $iflabel{ gpt }                           \
                      $reusemethod{ }                           \
                      method{ efi }                             \
                      format{ }                                 \
              .                                                 \
              102400 102400 102400 ext4                         \
                      method{ format }                          \
                      format{ }                                 \
                      use_filesystem{ }                         \
                      filesystem{ ext4 }                        \
                      mountpoint{ / }                           \
              .

### Rueckfragen abschalten
# Die Warnung "keine Swap-Partition angelegt" unterdruecken - das ist bei
# DialOS Absicht (siehe oben).
d-i partman-basicfilesystems/no_swap boolean false

# Nach der Auswahl der Zielplatte laeuft die Partitionierung ohne weitere
# Rueckfrage durch. ACHTUNG: Ab diesem Punkt ist die gewaehlte Platte
# geloescht.
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
