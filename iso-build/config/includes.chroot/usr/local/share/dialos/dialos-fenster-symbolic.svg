<?xml version="1.0" encoding="UTF-8"?>
<!--
  DialOS: Startknopf-Symbol fuer die Windows-Optik.

  Bewusst ein GENERISCHES Fenster-Sinnbild (Rahmen mit Kreuzsprosse, vier
  Scheiben) und NICHT das Windows-Logo von Microsoft. Das ist keine
  Kosmetik, sondern Absicht: DialOS wird verkauft, und ein fremdes
  Markenzeichen auf dem Startknopf eines verkauften Geraets waere ein
  Markenrechtsproblem. Microsofts Zeichen ist eine perspektivisch
  gekippte Vierergruppe ohne Rahmen in einem bestimmten Blau - dieses
  hier ist das seit Jahrzehnten uebliche, allgemeine Sinnbild fuer "ein
  Fenster" und wird von Windows-Gewohnten trotzdem sofort als
  Startknopf gelesen.

  AUFBAU GENAU WIE EIN ADWAITA-SYMBOL-ICON, und zwar aus einem konkreten
  Grund (2026-08-16, zweiter Anlauf): Die erste Fassung zeichnete den
  Rahmen als ausgesparte Flaeche (fill-rule="evenodd") und setzte die
  Farbe auf einer <g>-Gruppe. Als Vorschaubild gerendert sah das richtig
  aus - in der Leiste erschien aber nur ein weisses Rechteck: Beim
  Einfaerben durch GNOME gehen die Aussparungen verloren, die Flaeche
  laeuft voll. Deshalb jetzt:
    - EIN <path>, die Farbe direkt am Element (nicht auf einer Gruppe),
      exakt wie /usr/share/icons/Adwaita/symbolic/actions/*.svg;
    - KEINE Aussparungen und keine fill-rule - der Rahmen besteht aus
      vier vollen Balken, die Sprossen aus zwei weiteren. Ueberlappende
      Vollflaechen bleiben beim Einfaerben unveraendert, ausgesparte
      nicht.
  Merksatz fuer kuenftige Icons: Ein Symbol-Icon muss aus lauter
  Vollflaechen bestehen. Was als Loch gedacht ist, muss durch einen
  Zwischenraum entstehen, nicht durch eine Aussparung.

  Einfarbig und auf "-symbolic.svg" endend, damit GNOME Shell es
  einfaerbt: Es nimmt die Vordergrundfarbe der Leiste an und bleibt im
  hellen wie im dunklen Erscheinungsbild lesbar. Ein fest eingefaerbtes
  Icon waere in einem der beiden Faelle unsichtbar - fuer sehbehinderte
  Nutzer der Unterschied zwischen bedienbar und nicht bedienbar.
-->
<svg height="16px" viewBox="0 0 16 16" width="16px" xmlns="http://www.w3.org/2000/svg">
    <path d="m 1.6 2 h 12.8 v 1.5 h -12.8 z m 0 10.5 h 12.8 v 1.5 h -12.8 z m 0 -10.5 h 1.5 v 12 h -1.5 z m 11.3 0 h 1.5 v 12 h -1.5 z m -5.65 0 h 1.5 v 12 h -1.5 z m -5.65 5.25 h 12.8 v 1.5 h -12.8 z m 0 0" fill="#2e3436"/>
</svg>
