# DialOS: Echo-Unterdrueckung fuers Mikrofon.
#
# WARUM (gefunden am 2026-08-17): Der Sprachbefehl-Dienst hoert alles mit,
# was aus dem Lautsprecher kommt - die eigene Ansage ebenso wie Radio,
# Musik oder eine Mediathek. Weil die Spracherkennung mit einer
# eingeschraenkten Grammatik arbeitet, presst sie Bruchstuecke davon in
# einen Befehl: Beim Vorspielen der Start-Ansage hat sich der Desktop
# mitten in der Wiedergabe umgeschaltet. Ein Nachrichtensprecher, der
# "Windows" sagt, haette denselben Effekt.
#
# Der bisherige Schutz (Markierungsdatei "das System spricht gerade")
# kann das prinzipiell nicht loesen: Er kennt nur die eigene Ansage ueber
# dialos-say.py, nicht alles andere. Deshalb hier eine Stufe tiefer, in
# der Audiokette: Das Modul rechnet das Lautsprechersignal aus dem
# Mikrofonsignal heraus und stellt eine bereinigte Quelle bereit.
#
# ENTSCHEIDUNG monitor.mode = true:
# Ohne diese Option muessten alle Programme ihren Ton in eine eigens
# angelegte Senke spielen, damit das Modul weiss, was gerade zu hoeren
# ist. Das haette bedeutet, jede Audio-Ausgabe von DialOS umzubiegen -
# fehleranfaellig, und jedes neue Programm muesste daran denken. Mit
# monitor.mode nimmt das Modul stattdessen den Mitschnitt der Ausgabe als
# Referenz. Nichts muss umgeleitet werden.
#
# Kein node.target bei playback.props: So folgt die Referenz automatisch
# der Standard-Ausgabe. Wechselt der Nutzer vom Bluetooth-Lautsprecher
# auf die eingebauten, greift die Unterdrueckung weiter.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            # Mitschnitt der Ausgabe als Referenz statt eigener Senke.
            monitor.mode = true
            library.name = aec/libspa-aec-webrtc
            aec.args = {
                # Verstaerkungsregelung aus: Sie wuerde den Pegel
                # nachtraeglich veraendern, und genau am Pegel haengt die
                # Erkennung (siehe dialos-mikrofon-pegel.sh).
                webrtc.gain_control = false
                webrtc.extended_filter = true
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
            }
            capture.props = {
                node.name = "dialos.echo.aufnahme"
                # Bewusst fest das EINGEBAUTE Mikrofon: Wuerde das Modul
                # das Bluetooth-Mikrofon oeffnen, faellt das Headset auf
                # HFP und die Wiedergabe auf Telefonqualitaet.
                target.object = "alsa_input.pci-0000_00_1f.3.analog-stereo"
                node.passive = true
            }
            source.props = {
                node.name = "dialos_mikrofon_ohne_echo"
                node.description = "Mikrofon ohne Echo (DialOS)"
            }
            playback.props = {
                node.name = "dialos.echo.wiedergabe"
                node.passive = true
            }
            sink.props = {
                node.name = "dialos.echo.senke"
                node.description = "Echo-Referenz (DialOS)"
            }
        }
    }
]
