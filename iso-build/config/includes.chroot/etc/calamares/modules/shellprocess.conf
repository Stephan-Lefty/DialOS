# DialOS: Nachinstallations-Skripte, die im chroot des neu installierten
# Zielsystems laufen (dontChroot: false), nachdem das "users"-Modul das
# Admin-Konto angelegt hat.
---
dontChroot: false
timeout: 120
verbose: true
script:
    # Maus-Grundeinstellung "Linkshaender" NUR fuer das Admin-Konto
    # (${USER} = der von Calamares angelegte Benutzername, z. B.
    # "dialosadmin"). Das "-" am Anfang sorgt dafuer, dass ein Fehler
    # hier die Installation nicht abbricht (rein kosmetisch).
    - "-runuser -u ${USER} -- dbus-run-session -- dconf write /org/gnome/desktop/peripherals/mouse/left-handed true"
    # Calamares (Installer) wird auf dem fertig installierten Zielsystem
    # nicht mehr benoetigt und daher automatisch entfernt. WICHTIG: Dies
    # laeuft nur im chroot des NEUEN Zielsystems, NICHT auf der
    # Live-Vorlage, von der aus spaeter neue ISOs gebaut werden.
    - "-DEBIAN_FRONTEND=noninteractive apt-get purge -y calamares calamares-settings-debian"
    - "-DEBIAN_FRONTEND=noninteractive apt-get autoremove -y"
i18n:
    name: "DialOS-Feineinstellungen"
