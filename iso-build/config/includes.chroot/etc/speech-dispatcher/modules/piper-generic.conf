GenericCmdDependency "sox"
GenericCmdDependency "jq"
GenericExecuteSynth "cd /usr/local/share/dialos-piper && ./check_piper_voice.sh $VOICE && printf %s \'$DATA\' | ./piper/piper --model \'voices/$VOICE.onnx\' --noise_w 0 --output_raw | sox -v $VOLUME -r $(jq .audio.sample_rate < \'voices/$VOICE.onnx.json\') -c 1   -b 16 -e signed-integer -t raw - -t wav - tempo $RATE pitch $PITCH norm | $PLAY_COMMAND"
# "--noise_w 0" (Stephan, 2026-08-18, im Hoervergleich ausgewaehlt).
#
# Piper (ein VITS-Modell) hat einen Zufallsanteil in der Lautdauer.
# Gemessen: DERSELBE Satz kam in fuenf Durchlaeufen mit 2,456 bis 2,865 s
# heraus - 17 % Streuung, ohne dass sich eine Einstellung geaendert hatte.
# Mit noise_w 0 ist die Ausgabe auf die Millisekunde reproduzierbar.
#
# Aufgefallen ist es an einer Stelle, an der man es nicht erwartet:
# Stephan hoerte, dass die vorgelesene Notiz nicht zum Tempo der uebrigen
# Ansagen passt. Die kurzen Ansagen kommen aus dem Speicher
# (~/.cache/dialos/ansagen) und sind deshalb immer gleich; ein neuer Satz
# wurde jedes Mal neu gewuerfelt. Es war also KEIN Unterschied zwischen
# zwei Sprechwegen - es war Piper.
#
# WICHTIG: Derselbe Schalter muss in der Speicher-Kette von dialos-say.py
# stehen, sonst laufen die beiden Wege wieder auseinander. Der Speicher
# verliert seine Gueltigkeit von selbst, weil sein Schluessel die
# Aenderungszeit DIESER Datei enthaelt.
#
# Nebeneffekt: Die Ansagen werden rund 12 % kuerzer, ohne am Tempo zu
# drehen.
GenericRateAdd 1
GenericPitchAdd 1
GenericVolumeAdd 1
# 0.88 statt der frueheren 0.85 (Stephan, 2026-08-17, im Hoervergleich
# ausgewaehlt): Der Wert wirkt als "tempo" in der sox-Kette unten, also auf
# JEDE Sprachausgabe - nicht nur auf die Start-Ansage. Kleinere Zahl =
# langsamer. Verglichen wurden 0.72, 0.78, 0.85, 0.88 und 0.90.
# AUSLIEFERUNGSSTIMME: Anna (de_DE-kerstin-low), Tempo 1.00 - Stephans
# Entscheidung vom 2026-08-20. Beides gehoert zusammen und darf nur zusammen
# geaendert werden: Gemessen braucht derselbe Satz bei Thorsten 7,75 s mit
# Tempo 0,88, bei Kerstin 8,99 s mit demselben Wert. Ein Tempo, das zur
# vorigen Stimme gehoert, klingt bei der neuen gedehnt oder gehetzt.
#
# NICHT VON HAND AENDERN. dialos-stimme.py schaltet Stimme, Tempo UND den
# Namen des Assistenten zusammen um - der Name steht in der Begruessung
# ("Hallo, ich bin Anna"), und eine Frauenstimme, die sich als Michael
# vorstellt, waere schlicht falsch:
#
#     sudo dialos-stimme.py setzen kerstin
#     sudo dialos-stimme.py setzen thorsten
#
# Der Kunde soll spaeter bei der Ersteinrichtung selbst waehlen
# (docs/ersteinrichtung.md); bis dieser Assistent existiert, ist das hier der
# Ausgangspunkt.
GenericRateMultiply 1.00
GenericPitchMultiply 750
GenericVolumeMultiply 1
